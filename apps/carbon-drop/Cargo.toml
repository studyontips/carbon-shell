[package]
name = "carbon-drop"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.18.1"
i-slint-backend-winit = "1.18.1"
winit = "0.30"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["multipart", "stream", "json"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
arboard = "3"
mime_guess = "2.0"

[build-dependencies]
slint-build = "1.18.1"