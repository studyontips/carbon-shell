#################################################################
# CARBON SHELL — UNIVERSAL COMMON KEYBINDINGS                  #
# Shared across all desktop modes (Notch, Vanish, Minimal)      #
#################################################################

$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus

# Applications & Basic Actions
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, RETURN, exec, [float; size 800 550] $terminal 
bind = $mainMod, Q, killactive,
bind = ALT, F4, killactive,
bind = $mainMod SHIFT, Q, exec, ~/.config/carbon/scripts/KillActiveProcess.sh
bind = CTRL ALT, Delete, exec, hyprctl dispatch exit 0
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, F, exec, ~/.config/carbon/scripts/carbon-focus.sh
bind = $mainMod SHIFT, S, exec, ~/.config/carbon/scripts/screenshot.sh

# Carbon Utilities & Settings
bind = $mainMod, comma, exec, ~/.config/carbon/scripts/carbon-config-editor
bind = $mainMod SHIFT, comma, exec, ~/.config/carbon/scripts/carbon-settings-hub
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = $mainMod, T, exec, ~/.config/carbon/scripts/carbon-pomodoro
bind = $mainMod SHIFT, D, exec, ~/.config/carbon/scripts/carbon-drop.sh
bind = $mainMod, L, exec, ~/.config/carbon/scripts/hyprlock.sh
bind = $mainMod, V, exec, bash -c 'cliphist list | rofi -dmenu | cliphist decode | wl-copy'

# Window Focus Navigation (Active in all modes)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move Windows (WASD dedicated window movement)
bind = $mainMod, W, movewindow, u
bind = $mainMod, A, movewindow, l
bind = $mainMod, S, movewindow, d
bind = $mainMod, D, movewindow, r

# Resize windows (SUPER + SHIFT + Arrows)
binde = $mainMod SHIFT, left, resizeactive, -50 0
binde = $mainMod SHIFT, right, resizeactive, 50 0
binde = $mainMod SHIFT, up, resizeactive, 0 -50
binde = $mainMod SHIFT, down, resizeactive, 0 50

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Hardware / Media keys
bindel = ,XF86AudioRaiseVolume, exec, ~/.config/carbon/scripts/volume.sh --inc
bindel = ,XF86AudioLowerVolume, exec, ~/.config/carbon/scripts/volume.sh --dec
bindel = ,XF86AudioMute, exec, ~/.config/carbon/scripts/volume.sh --toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = ,XF86AudioNext, exec, playerctl next
bindl  = ,XF86AudioPause, exec, playerctl play-pause
bindl  = ,XF86AudioPlay, exec, playerctl play-pause
bindl  = ,XF86AudioPrev, exec, playerctl previous
