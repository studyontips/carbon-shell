#################################################################
# CARBON SHELL — MINIMAL NOTCH / TIDE ISLAND KEYBINDINGS        #
# Active when Bar Mode is set to Minimal Island / Minimal Notch #
#################################################################

$mainMod = SUPER

# Tide Island Surface & Popup Controls
bind = $mainMod SHIFT, E, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/quickshell/carbon call tide toggleControlCenter
bind = $mainMod, R, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/quickshell/carbon call tide toggleApplicationLauncher
bind = $mainMod, M, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/quickshell/carbon call tide togglePlayer
bind = $mainMod, N, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/quickshell/carbon call tide toggleWallpaperPicker
bind = $mainMod SHIFT, N, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/quickshell/carbon call tide toggleNotificationCenter
bind = $mainMod SHIFT, P, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/quickshell/carbon call tide togglePowerMenu
bind = $mainMod, TAB, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/quickshell/carbon call overview toggle
bind = $mainMod, B, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/quickshell/carbon call tide toggle

# Minimal Island Gestures (Using ALT modifier to prevent clash with arrow movefocus)
bind = $mainMod ALT, right, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/quickshell/carbon call tide swipeRight
bind = $mainMod ALT, left, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/quickshell/carbon call tide swipeLeft
bind = $mainMod ALT, down, exec, /usr/bin/quickshell ipc --any-display -p ~/.local/share/quickshell/carbon call tide showClock
