general {
    gaps_in = 5
    gaps_out = 10

    border_size = 1

    col.active_border = $outline
    col.inactive_border = $outline_variant

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 15
    rounding_power = 2

    active_opacity = 0.95
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        ignore_opacity = true
        new_optimizations = true
        special = false
        popups = true
        xray = false
        noise = 0.0
        brightness = 1.0
        contrast = 1.0
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
    }

}
