#################################################################
# CARBON SHELL — VANISH MODE KEYBINDINGS                       #
# Active when Bar Mode is set to Vanish / Nucleus               #
#################################################################

$mainMod = SUPER

# Vanish Atomic Satellite Triggers
bindr = $mainMod, Super_L, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh toggle-hub
bindr = $mainMod, Super_R, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh toggle-hub
bind = $mainMod, R, exec, ~/.config/carbon/scripts/carbon-ipc.sh spotlight
bind = $mainMod, K, exec, ~/.config/carbon/scripts/carbon-ipc.sh spotlight
bind = $mainMod, M, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh lyrics
bind = $mainMod, N, exec, sh ~/.config/carbon/scripts/carbon-ipc.sh wallpaper
bind = $mainMod, B, exec, sh ~/.config/carbon/scripts/carbon-vanish-dispatch.sh quick-toggles
bind = $mainMod, Tab, exec, ~/.config/carbon/scripts/carbon-ipc.sh toggle-overview
